apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-resolve-art-nvr
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: snapshot-metadata
spec:
  description: >-
    Optionally resolve the MTA-Ops and rsync Snapshot image digests to ART NVRs
    for logging. ART lookup is informational and never blocks the test pipeline.
  params:
    - name: mtaOpsImagePullspec
      type: string
      description: Stage or Konflux MTA-Ops image pullspec.
    - name: mtaOpsRsyncImagePullspec
      type: string
      description: Stage or Konflux rsync image pullspec.
    - name: artBuildHistoryUrl
      type: string
      default: ""
      description: ART Build History base URL; empty disables lookup.
    - name: artGroup
      type: string
      default: mta-8.3
      description: ART build group.
  results:
    - name: mtaOpsNvr
      description: Resolved ART NVR, or unknown when unavailable.
    - name: mtaOpsRsyncNvr
      description: Resolved rsync ART NVR, or unknown when unavailable.
  steps:
    - name: resolve
      image: quay.io/konflux-ci/konflux-test:stable
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        result_path="$(results.mtaOpsNvr.path)"
        printf '%s' unknown > "${result_path}"
        rsync_result_path="$(results.mtaOpsRsyncNvr.path)"
        printf '%s' unknown > "${rsync_result_path}"
        art_url="$(params.artBuildHistoryUrl)"
        art_group="$(params.artGroup)"

        if [ -z "${art_url}" ] || [ -z "${art_group}" ]; then
          echo "ART lookup skipped: artBuildHistoryUrl or artGroup is empty"
          exit 0
        fi

        start_date=$(date -u -d '90 days ago' +%F 2>/dev/null || date -u -v-90d +%F)
        end_date=$(date -u +%F)
        search_url="${art_url%/}/search?group=${art_group}&assembly=stream&outcome=Success&engine=konflux&dateRange=${start_date}+to+${end_date}"

        response=$(curl -fsS --max-time 30 \
          -H 'X-Requested-With: XMLHttpRequest' \
          "${search_url}" 2>/dev/null) || {
          echo "ART lookup skipped: ART API was unavailable"
          exit 0
        }

        resolve_nvr() {
          local label="$1"
          local art_name="$2"
          local image_pullspec="$3"
          local output_path="$4"
          local digest="${image_pullspec##*@}"

          if [[ "${digest}" != sha256:* ]]; then
            echo "ART lookup skipped for ${label}: image is not digest-pinned"
            return 0
          fi

          nvr=$(printf '%s' "${response}" | jq -r \
            --arg name "${art_name}" --arg digest "${digest}" '
              [.builds[]?
               | select(.name == $name)
               | select((.outcome // "" | ascii_downcase) == "success")
               | select((.image_pullspec // "") | endswith("@" + $digest))
               | .nvr] | first // empty')

          if [ -z "${nvr}" ]; then
            echo "ART lookup found no successful ${label} NVR for ${digest}"
            return 0
          fi

          echo "Resolved ${label} ART NVR: ${nvr}"
          printf '%s' "${nvr}" > "${output_path}"
        }

        resolve_nvr "MTA-Ops" "mta-ops" "$(params.mtaOpsImagePullspec)" "${result_path}"
        resolve_nvr "MTA-Ops rsync" "mta-rsync-transfer" \
          "$(params.mtaOpsRsyncImagePullspec)" "${rsync_result_path}"
