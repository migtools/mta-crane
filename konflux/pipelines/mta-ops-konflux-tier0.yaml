apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-ops-konflux-tier0
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: ocpctl-test
spec:
  description: >-
    Konflux-style MTA-Ops Tier 0 pipeline. Leases two OCPCTL pool clusters,
    downloads their kubeconfigs, runs Tier 0, and releases both clusters.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux Snapshot JSON.
    - name: profile
      type: string
      default: aws-sno-ga
    - name: sourceVersion
      type: string
      default: "4.21"
    - name: targetVersion
      type: string
      default: "4.22"
    - name: region
      type: string
      default: us-east-1
    - name: baseDomain
      type: string
      default: mg.dog8code.com
    - name: team
      type: string
      default: CI-Automation
    - name: costCenter
      type: string
      default: "773"
    - name: ownerEmail
      type: string
      default: ""
    - name: deleteDelaySeconds
      type: string
      default: "3600"
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
    - name: artBuildHistoryUrl
      type: string
      default: ""
      description: Optional ART Build History API base URL for NVR logging.
    - name: artGroup
      type: string
      default: mta-8.3
      description: ART build group for NVR lookup.
  workspaces:
    - name: shared-workspace
  results:
    - name: sourceClusterId
      value: $(tasks.provision-fresh-clusters.results.sourceClusterId)
    - name: targetClusterId
      value: $(tasks.provision-fresh-clusters.results.targetClusterId)
    - name: sourceVersion
      value: $(tasks.verify-clusters.results.sourceVersion)
    - name: targetVersion
      value: $(tasks.verify-clusters.results.targetVersion)
    - name: mtaOpsNvr
      value: $(tasks.resolve-art-nvr.results.mtaOpsNvr)
    - name: mtaOpsRsyncNvr
      value: $(tasks.resolve-art-nvr.results.mtaOpsRsyncNvr)
    - name: testStatus
      value: $(tasks.run-tier0.results.testStatus)
  tasks:
    - name: extract-image-references
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-extract-image-references.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: resolve-art-nvr
      runAfter:
        - extract-image-references
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-resolve-art-nvr.yaml
      params:
        - name: mtaOpsImagePullspec
          value: $(tasks.extract-image-references.results.mtaOpsImagePullspec)
        - name: mtaOpsRsyncImagePullspec
          value: $(tasks.extract-image-references.results.mtaOpsRsyncImage)
        - name: artBuildHistoryUrl
          value: $(params.artBuildHistoryUrl)
        - name: artGroup
          value: $(params.artGroup)
    - name: provision-fresh-clusters
      runAfter:
        - resolve-art-nvr
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-provision-fresh-clusters.yaml
      params:
        - name: sourceVersion
          value: $(params.sourceVersion)
        - name: targetVersion
          value: $(params.targetVersion)
        - name: profile
          value: $(params.profile)
        - name: region
          value: $(params.region)
        - name: baseDomain
          value: $(params.baseDomain)
        - name: team
          value: $(params.team)
        - name: costCenter
          value: $(params.costCenter)
        - name: ownerEmail
          value: $(params.ownerEmail)
        - name: ocpctlUrl
          value: $(params.ocpctlUrl)
        - name: ocpctlSecretName
          value: $(params.ocpctlSecretName)
        - name: ocpctlSecretKey
          value: $(params.ocpctlSecretKey)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: merge-kubeconfigs
      runAfter:
        - provision-fresh-clusters
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-merge-kubeconfigs.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: setup-nonadmin-contexts
      runAfter:
        - configure-pull-secrets
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-setup-nonadmin-contexts.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: configure-pull-secrets
      runAfter:
        - merge-kubeconfigs
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-configure-cluster-pull-secret.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: verify-clusters
      runAfter:
        - setup-nonadmin-contexts
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-verify-contexts.yaml
      params:
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: prepare-tools
      runAfter:
        - verify-clusters
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-prepare-tools.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: extract-mta-ops
      runAfter:
        - prepare-tools
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-extract-image.yaml
      params:
        - name: imagePullspec
          value: $(tasks.extract-image-references.results.mtaOpsImagePullspec)
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: run-tier0
      runAfter:
        - extract-mta-ops
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-run-tier0.yaml
      params:
        - name: testRepositoryPath
          value: $(tasks.prepare-tools.results.testRepositoryPath)
        - name: mtaOpsBinaryPath
          value: $(tasks.extract-mta-ops.results.mtaOpsBinaryPath)
        - name: k8sDeployBinaryPath
          value: $(tasks.prepare-tools.results.k8sDeployBinaryPath)
        - name: mtaOpsRsyncImage
          value: $(tasks.extract-image-references.results.mtaOpsRsyncImage)
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
  finally:
    - name: delete-fresh-clusters
      when:
        - input: $(tasks.provision-fresh-clusters.status)
          operator: in
          values: [Succeeded, Failed, Cancelled]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-delete-fresh-clusters.yaml
      params:
        - name: sourceClusterId
          value: $(tasks.provision-fresh-clusters.results.sourceClusterId)
        - name: targetClusterId
          value: $(tasks.provision-fresh-clusters.results.targetClusterId)
        - name: delaySeconds
          value: $(params.deleteDelaySeconds)
        - name: ocpctlUrl
          value: $(params.ocpctlUrl)
        - name: ocpctlSecretName
          value: $(params.ocpctlSecretName)
        - name: ocpctlSecretKey
          value: $(params.ocpctlSecretKey)
