apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-ops-existing-clusters-debug
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: existing-cluster-debug
spec:
  description: >-
    Debug MTA-Ops Tier 0 on existing source and target clusters without
    provisioning or cleanup. Runs only the requested focused test.
  params:
    - name: SNAPSHOT
      type: string
    - name: sourceClusterId
      type: string
    - name: targetClusterId
      type: string
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  workspaces:
    - name: shared-workspace
  tasks:
    - name: extract-image-references
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-extract-image-references.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: download-source-kubeconfig
      runAfter:
        - extract-image-references
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-ocpctl-download-kubeconfig.yaml
      params:
        - name: clusterId
          value: $(params.sourceClusterId)
        - name: outputFileName
          value: source.kubeconfig
        - name: ocpctlUrl
          value: $(params.ocpctlUrl)
        - name: ocpctlSecretName
          value: $(params.ocpctlSecretName)
        - name: ocpctlSecretKey
          value: $(params.ocpctlSecretKey)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: download-target-kubeconfig
      runAfter:
        - extract-image-references
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-ocpctl-download-kubeconfig.yaml
      params:
        - name: clusterId
          value: $(params.targetClusterId)
        - name: outputFileName
          value: target.kubeconfig
        - name: ocpctlUrl
          value: $(params.ocpctlUrl)
        - name: ocpctlSecretName
          value: $(params.ocpctlSecretName)
        - name: ocpctlSecretKey
          value: $(params.ocpctlSecretKey)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: merge-kubeconfigs
      runAfter:
        - download-source-kubeconfig
        - download-target-kubeconfig
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-merge-kubeconfigs.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: setup-nonadmin-contexts
      runAfter:
        - merge-kubeconfigs
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-setup-nonadmin-contexts.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: verify-clusters
      runAfter:
        - setup-nonadmin-contexts
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-verify-contexts.yaml
      params:
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: prepare-tools
      runAfter:
        - verify-clusters
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-prepare-tools.yaml
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: extract-mta-ops
      runAfter:
        - prepare-tools
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-extract-image.yaml
      params:
        - name: imagePullspec
          value: $(tasks.extract-image-references.results.mtaOpsImagePullspec)
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
    - name: run-mta-804
      runAfter:
        - extract-mta-ops
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-crane
          - name: revision
            value: konflux-its
          - name: pathInRepo
            value: konflux/tasks/mta-ops-run-tier0.yaml
      params:
        - name: testRepositoryPath
          value: $(tasks.prepare-tools.results.testRepositoryPath)
        - name: mtaOpsBinaryPath
          value: $(tasks.extract-mta-ops.results.mtaOpsBinaryPath)
        - name: k8sDeployBinaryPath
          value: $(tasks.prepare-tools.results.k8sDeployBinaryPath)
        - name: mtaOpsRsyncImage
          value: $(tasks.extract-image-references.results.mtaOpsRsyncImage)
        - name: kubeconfigPath
          value: $(tasks.merge-kubeconfigs.results.kubeconfigPath)
        - name: testFilter
          value: MTA-804
      workspaces:
        - name: shared-workspace
          workspace: shared-workspace
