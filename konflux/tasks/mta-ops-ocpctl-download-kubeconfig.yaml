apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-ocpctl-download-kubeconfig
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: >-
    Create a token-based kubeconfig from OCPCTL kubeadmin credentials, matching
    the login flow used by the Jenkins test runner.
  params:
    - name: clusterId
      type: string
    - name: outputFileName
      type: string
      description: File name written under the workspace .kube directory.
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
      description: OCPCTL API base URL.
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  workspaces:
    - name: shared-workspace
  results:
    - name: kubeconfigPath
      description: Absolute path to the token-based kubeconfig.
  steps:
    - name: create-token-kubeconfig
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        umask 077

        workspace_path="$(workspaces.shared-workspace.path)"
        kubeconfig_dir="${workspace_path}/.kube"
        kubeconfig_path="${kubeconfig_dir}/$(params.outputFileName)"
        mkdir -p "${kubeconfig_dir}"

        # The raw OCPCTL kubeconfig can authenticate as system:admin with a
        # client certificate, but k8s-apps-deployer's Ansible modules require a
        # bearer token. Fetch the kubeadmin credentials from OCPCTL outputs and
        # perform the same oc login used by the Jenkins runner. Never log the
        # response body, password, token, or kubeconfig contents.
        python3 - "$(params.ocpctlUrl)" "$(params.clusterId)" "${kubeconfig_path}" <<'PY'
        import json
        import os
        import ssl
        import subprocess
        import sys
        import time
        import urllib.request

        base_url, cluster_id, kubeconfig_path = sys.argv[1:]
        api_key = os.environ.get("OCPCTL_API_KEY", "")
        if not api_key:
            raise SystemExit("OCPCTL API key is not set")

        outputs_url = f"{base_url.rstrip('/')}/clusters/{cluster_id}/outputs"
        tls_context = ssl._create_unverified_context()
        max_attempts = 6

        for attempt in range(1, max_attempts + 1):
            try:
                request = urllib.request.Request(
                    outputs_url,
                    headers={"Authorization": f"Bearer {api_key}"},
                )
                with urllib.request.urlopen(request, context=tls_context, timeout=30) as response:
                    outputs = json.load(response)

                kubeadmin = outputs.get("kubeadmin") or {}
                api_url = (outputs.get("api_url") or "").strip()
                username = (kubeadmin.get("username") or "").strip()
                password = kubeadmin.get("password") or ""
                if not api_url or not username or not password:
                    raise ValueError("OCPCTL outputs do not include kubeadmin login credentials")

                try:
                    os.unlink(kubeconfig_path)
                except FileNotFoundError:
                    pass

                login = subprocess.run(
                    [
                        "oc", "login", api_url,
                        "-u", username,
                        "-p", password,
                        "--insecure-skip-tls-verify=true",
                        f"--kubeconfig={kubeconfig_path}",
                    ],
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                    check=False,
                )
                if login.returncode != 0:
                    raise RuntimeError("oc login failed")

                os.chmod(kubeconfig_path, 0o600)
                identity = subprocess.check_output(
                    ["oc", f"--kubeconfig={kubeconfig_path}", "whoami"],
                    text=True,
                    stderr=subprocess.DEVNULL,
                ).strip()
                server = subprocess.check_output(
                    ["oc", f"--kubeconfig={kubeconfig_path}", "whoami", "--show-server"],
                    text=True,
                    stderr=subprocess.DEVNULL,
                ).strip()
                token = subprocess.check_output(
                    [
                        "oc", f"--kubeconfig={kubeconfig_path}", "config", "view",
                        "--minify", "--raw", "-o", "jsonpath={.users[0].user.token}",
                    ],
                    text=True,
                    stderr=subprocess.DEVNULL,
                ).strip()
                if not token:
                    raise RuntimeError("oc login did not produce a bearer-token kubeconfig")
                subprocess.run(
                    ["oc", f"--kubeconfig={kubeconfig_path}", "get", "--raw=/version"],
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                    check=True,
                )

                print(f"Token-based admin kubeconfig verified for {server} as {identity}")
                break
            except Exception as error:
                # Exception details can include URLs or server responses; keep
                # logs to the exception type and retry count only.
                print(f"Kubeconfig setup attempt {attempt}/{max_attempts} failed ({type(error).__name__})")
                if attempt == max_attempts:
                    raise SystemExit("Could not create a token-based kubeconfig from OCPCTL outputs")
                time.sleep(15)
        PY

        chmod 600 "${kubeconfig_path}"
        printf '%s' "${kubeconfig_path}" > "$(results.kubeconfigPath.path)"
