apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-ocpctl-download-kubeconfig
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: >-
    Download an OCPCTL cluster kubeconfig into the shared workspace and verify
    that its admin credentials can access the cluster before continuing.
  params:
    - name: clusterId
      type: string
    - name: outputFileName
      type: string
      description: File name written under the workspace .kube directory.
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
      description: OCPCTL API base URL.
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  workspaces:
    - name: shared-workspace
  results:
    - name: kubeconfigPath
      description: Absolute path to the downloaded kubeconfig.
  steps:
    - name: download
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        workspace_path="$(workspaces.shared-workspace.path)"
        kubeconfig_dir="${workspace_path}/.kube"
        kubeconfig_path="${kubeconfig_dir}/$(params.outputFileName)"
        mkdir -p "${kubeconfig_dir}"

        max_attempts=6
        for attempt in $(seq 1 "${max_attempts}"); do
          rm -f "${kubeconfig_path}"
          download_url=""

          response=$(curl -fsS --insecure \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            "$(params.ocpctlUrl)/clusters/$(params.clusterId)/kubeconfig/download-url" 2>/dev/null || true)
          download_url=$(printf '%s' "${response}" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("download_url", ""))' \
            2>/dev/null || true)

          if [ -n "${download_url}" ]; then
            if [[ "${download_url}" == /api/* ]]; then
              base_url="$(params.ocpctlUrl)"
              base_url="${base_url%%/api/*}"
              curl -fsS --insecure -o "${kubeconfig_path}" \
                -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
                "${base_url}${download_url}" 2>/dev/null || true
            else
              curl -fsS --insecure -o "${kubeconfig_path}" \
                "${download_url}" 2>/dev/null || true
            fi
          fi

          if [ -s "${kubeconfig_path}" ] && \
             KUBECONFIG="${kubeconfig_path}" oc whoami >/dev/null 2>&1 && \
             KUBECONFIG="${kubeconfig_path}" oc get --raw=/version >/dev/null 2>&1; then
            echo "Admin kubeconfig verified on attempt ${attempt}"
            chmod 600 "${kubeconfig_path}"
            printf '%s' "${kubeconfig_path}" > "$(results.kubeconfigPath.path)"
            exit 0
          fi

          echo "Downloaded kubeconfig is not authenticated yet (${attempt}/${max_attempts})"
          sleep 15
        done

        echo "ERROR: OCPCTL returned a kubeconfig that could not authenticate to cluster $(params.clusterId)"
        exit 1
