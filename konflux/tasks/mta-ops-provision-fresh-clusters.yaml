apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-provision-fresh-clusters
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: Provision fresh source and target OpenShift clusters through OCPCTL.
  params:
    - name: sourceVersion
      type: string
      default: "4.21"
    - name: targetVersion
      type: string
      default: "4.22"
    - name: profile
      type: string
      default: aws-sno-ga
    - name: region
      type: string
      default: us-east-1
    - name: baseDomain
      type: string
      default: mg.dog8code.com
    - name: team
      type: string
      default: CI-Automation
    - name: costCenter
      type: string
      default: "773"
    - name: ownerEmail
      type: string
      default: ""
      description: Optional owner; resolved from OCPCTL auth when empty.
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  workspaces:
    - name: shared-workspace
  results:
    - name: sourceClusterId
    - name: targetClusterId
    - name: sourceKubeconfigPath
    - name: targetKubeconfigPath
  steps:
    - name: provision
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WORKSPACE_PATH="$(workspaces.shared-workspace.path)"
        KUBECONFIG_DIR="${WORKSPACE_PATH}/.kube"
        mkdir -p "${KUBECONFIG_DIR}"
        printf '' > "$(results.sourceClusterId.path)"
        printf '' > "$(results.targetClusterId.path)"

        OWNER="$(params.ownerEmail)"
        if [ -z "${OWNER}" ]; then
          OWNER=$(curl -fsS --insecure \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            "$(params.ocpctlUrl)/auth/me" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("user") or {}).get("email") or d.get("email") or "")')
        fi
        test -n "${OWNER}"

        wait_for_ready() {
          local cluster_id="$1"
          local elapsed=0
          while [ "${elapsed}" -lt 5400 ]; do
            status=$(curl -fsS --insecure \
              -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
              "$(params.ocpctlUrl)/clusters/${cluster_id}" | \
              python3 -c 'import json,sys; d=json.load(sys.stdin); print(str((d.get("cluster") or d).get("status", "")).upper())')
            echo "${cluster_id} status=${status} elapsed=${elapsed}s"
            if [ "${status}" = READY ]; then return 0; fi
            if [ "${status}" = FAILED ] || [ "${status}" = DESTROY_FAILED ]; then return 1; fi
            sleep 30
            elapsed=$((elapsed + 30))
          done
          return 1
        }

        download_kubeconfig() {
          local cluster_id="$1"
          local output_path="$2"
          response=$(curl -fsS --insecure \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            "$(params.ocpctlUrl)/clusters/${cluster_id}/kubeconfig/download-url")
          download_url=$(printf '%s' "${response}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("download_url", ""))')
          test -n "${download_url}"
          if [[ "${download_url}" == /api/* ]]; then
            base_url="$(params.ocpctlUrl)"
            base_url="${base_url%%/api/*}"
            curl -fsS --insecure -o "${output_path}" \
              -H "Authorization: Bearer ${OCPCTL_API_KEY}" "${base_url}${download_url}"
          else
            curl -fsS --insecure -o "${output_path}" "${download_url}"
          fi
          chmod 600 "${output_path}"
          KUBECONFIG="${output_path}" oc whoami >/dev/null
        }

        create_cluster() {
          local role="$1"
          local version="$2"
          local result_path="$3"
          local kubeconfig_path="$4"
          local unique_name="mta-${role}-$(date +%s)-${RANDOM}"

          response=$(curl -fsS --insecure -X POST "$(params.ocpctlUrl)/clusters" \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"${unique_name}\",\"platform\":\"aws\",\"cluster_type\":\"openshift\",\"version\":\"${version}\",\"profile\":\"$(params.profile)\",\"region\":\"$(params.region)\",\"base_domain\":\"$(params.baseDomain)\",\"owner\":\"${OWNER}\",\"team\":\"$(params.team)\",\"cost_center\":\"$(params.costCenter)\",\"ttl_hours\":4}")
          cluster_id=$(printf '%s' "${response}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          test -n "${cluster_id}"
          printf '%s' "${cluster_id}" > "${result_path}"
          echo "Created ${role} cluster ${cluster_id}"
          wait_for_ready "${cluster_id}"
          download_kubeconfig "${cluster_id}" "${kubeconfig_path}"
        }

        create_cluster source "$(params.sourceVersion)" \
          "$(results.sourceClusterId.path)" "${KUBECONFIG_DIR}/source.kubeconfig"
        create_cluster target "$(params.targetVersion)" \
          "$(results.targetClusterId.path)" "${KUBECONFIG_DIR}/target.kubeconfig"
        printf '%s' "${KUBECONFIG_DIR}/source.kubeconfig" > "$(results.sourceKubeconfigPath.path)"
        printf '%s' "${KUBECONFIG_DIR}/target.kubeconfig" > "$(results.targetKubeconfigPath.path)"
