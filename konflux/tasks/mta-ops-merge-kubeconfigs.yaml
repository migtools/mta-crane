apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-merge-kubeconfigs
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: test-setup
spec:
  description: Merge the source and target kubeconfigs created by login Tasks.
  workspaces:
    - name: shared-workspace
      description: Workspace containing source and target kubeconfig files.
  results:
    - name: kubeconfigPath
      description: Absolute path to the merged kubeconfig.
  steps:
    - name: merge
      image: quay.io/migqe/migqe-base:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        umask 077

        KUBECONFIG_DIR="$(workspaces.shared-workspace.path)/.kube"
        SOURCE_KUBECONFIG="${KUBECONFIG_DIR}/source.kubeconfig"
        TARGET_KUBECONFIG="${KUBECONFIG_DIR}/target.kubeconfig"
        MERGED_KUBECONFIG="${KUBECONFIG_DIR}/merged-kubeconfig"

        echo "Kubeconfig workspace: ${KUBECONFIG_DIR}"
        if [ ! -f "${SOURCE_KUBECONFIG}" ]; then
          echo "ERROR: source kubeconfig is missing: ${SOURCE_KUBECONFIG}"
          ls -la "${KUBECONFIG_DIR}" 2>&1 || true
          exit 1
        fi
        if [ ! -s "${SOURCE_KUBECONFIG}" ]; then
          echo "ERROR: source kubeconfig is empty: ${SOURCE_KUBECONFIG}"
          exit 1
        fi
        if [ ! -f "${TARGET_KUBECONFIG}" ]; then
          echo "ERROR: target kubeconfig is missing: ${TARGET_KUBECONFIG}"
          ls -la "${KUBECONFIG_DIR}" 2>&1 || true
          exit 1
        fi
        if [ ! -s "${TARGET_KUBECONFIG}" ]; then
          echo "ERROR: target kubeconfig is empty: ${TARGET_KUBECONFIG}"
          exit 1
        fi
        echo "Source kubeconfig size: $(wc -c < "${SOURCE_KUBECONFIG}") bytes"
        echo "Target kubeconfig size: $(wc -c < "${TARGET_KUBECONFIG}") bytes"

        SOURCE_CURRENT_CONTEXT=$(KUBECONFIG="${SOURCE_KUBECONFIG}" \
          oc config current-context)
        TARGET_CURRENT_CONTEXT=$(KUBECONFIG="${TARGET_KUBECONFIG}" \
          oc config current-context)

        if [ -z "${SOURCE_CURRENT_CONTEXT}" ]; then
          echo "ERROR: source kubeconfig has no current context"
          exit 1
        fi
        if [ -z "${TARGET_CURRENT_CONTEXT}" ]; then
          echo "ERROR: target kubeconfig has no current context"
          exit 1
        fi
        echo "Source current context: ${SOURCE_CURRENT_CONTEXT}"
        echo "Target current context: ${TARGET_CURRENT_CONTEXT}"

        oc config rename-context "${SOURCE_CURRENT_CONTEXT}" src \
          --kubeconfig="${SOURCE_KUBECONFIG}"
        oc config rename-context "${TARGET_CURRENT_CONTEXT}" tgt \
          --kubeconfig="${TARGET_KUBECONFIG}"

        SOURCE_JSON="${SOURCE_KUBECONFIG}.json"
        TARGET_JSON="${TARGET_KUBECONFIG}.json"
        MERGED_JSON="${MERGED_KUBECONFIG}.json"
        FINAL_JSON="${MERGED_KUBECONFIG}.final"
        trap 'rm -f "${SOURCE_JSON}" "${TARGET_JSON}" "${MERGED_JSON}" "${FINAL_JSON}"' EXIT
        KUBECONFIG="${SOURCE_KUBECONFIG}" oc config view --raw -o json > "${SOURCE_JSON}"
        KUBECONFIG="${TARGET_KUBECONFIG}" oc config view --raw -o json > "${TARGET_JSON}"
        KUBECONFIG="${SOURCE_KUBECONFIG}:${TARGET_KUBECONFIG}" \
          oc config view --flatten --raw -o json > "${MERGED_JSON}"

        python3 "${SOURCE_JSON}" "${TARGET_JSON}" "${MERGED_JSON}" > "${FINAL_JSON}" <<'PY'
        import json
        import sys

        source_path, target_path, merged_path = sys.argv[1:]
        with open(merged_path) as stream:
            merged = json.load(stream)

        for source_path, context_name, new_user in (
            (source_path, "src", "src-admin"),
            (target_path, "tgt", "tgt-admin"),
        ):
            with open(source_path) as stream:
                source = json.load(stream)
            context = next(item for item in source["contexts"] if item["name"] == context_name)
            old_user = context["context"]["user"]
            user = next(item for item in source["users"] if item["name"] == old_user)
            cloned_user = json.loads(json.dumps(user))
            cloned_user["name"] = new_user
            merged["users"] = [item for item in merged.get("users", []) if item["name"] != new_user]
            merged.setdefault("users", []).append(cloned_user)
            merged_context = next(item for item in merged["contexts"] if item["name"] == context_name)
            merged_context["context"]["user"] = new_user

        json.dump(merged, sys.stdout)
        PY
        test -s "${FINAL_JSON}"
        mv "${FINAL_JSON}" "${MERGED_KUBECONFIG}"
        chmod 600 "${MERGED_KUBECONFIG}"

        echo -n "${MERGED_KUBECONFIG}" > "$(results.kubeconfigPath.path)"
        echo "Created merged kubeconfig with contexts:"
        echo "Merged users:"
        oc --kubeconfig="${MERGED_KUBECONFIG}" config get-users
        oc --kubeconfig="${MERGED_KUBECONFIG}" config get-contexts
        oc --kubeconfig="${MERGED_KUBECONFIG}" --context=src get --raw=/version >/dev/null
        oc --kubeconfig="${MERGED_KUBECONFIG}" --context=tgt get --raw=/version >/dev/null
        echo "Merged source and target admin contexts are authenticated"
