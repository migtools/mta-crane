apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-delete-one-fresh-cluster
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: Delete one fresh OCPCTL cluster after an optional debugging delay.
  params:
    - name: clusterId
      type: string
    - name: delaySeconds
      type: string
      default: "3600"
    - name: additionalDelaySeconds
      type: string
      default: "0"
    - name: ocpctlUrl
      type: string
      default: https://ocpctl.apps.cnv2.engineering.redhat.com/api/v1
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  steps:
    - name: delete
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cluster_id="$(params.clusterId)"
        [ -n "${cluster_id}" ] || exit 0
        total_delay=$(( $(params.delaySeconds) + $(params.additionalDelaySeconds) ))
        sleep "${total_delay}"
        curl -fsS --insecure -X DELETE \
          "$(params.ocpctlUrl)/clusters/${cluster_id}" \
          -H "Authorization: Bearer ${OCPCTL_API_KEY}" >/dev/null || true
        echo "Delete requested for ${cluster_id}"
