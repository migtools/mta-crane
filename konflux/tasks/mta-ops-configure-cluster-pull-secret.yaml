apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-configure-cluster-pull-secret
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-setup
spec:
  description: >-
    Merge the Konflux registry-pull-secrets credentials into the source and
    target OpenShift pull-secrets so test workloads can pull Snapshot images.
  params:
    - name: registryPullSecretName
      type: string
      default: registry-pull-secrets
      description: Tenant Secret containing registry credentials.
  workspaces:
    - name: shared-workspace
      description: Workspace containing source and target admin kubeconfigs.
  results:
    - name: status
      description: Pull-secret configuration status.
  volumes:
    - name: registry-pull-secret
      secret:
        secretName: $(params.registryPullSecretName)
        optional: true
  steps:
    - name: merge-pull-secrets
      image: quay.io/openshift/origin-cli:4.21
      volumeMounts:
        - name: registry-pull-secret
          mountPath: /registry-pull-secret
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        trap 'printf FAILED > "$(results.status.path)"' ERR

        registry_files=()
        for candidate in \
          /tekton/home/.docker/config.json \
          /tekton/creds/.dockerconfigjson \
          /tekton/creds-secrets/*/.dockerconfigjson \
          /registry-pull-secret/.dockerconfigjson; do
          if [ -s "${candidate}" ]; then
            registry_files+=("${candidate}")
          fi
        done
        if [ "${#registry_files[@]}" -eq 0 ]; then
          echo "ERROR: no registry credentials were available from the Konflux service account or $(params.registryPullSecretName)"
          exit 1
        fi

        python3 -c 'import json,sys; out={"auths":{}}; [out["auths"].update(json.load(open(p)).get("auths", {})) for p in sys.argv[1:]]; print(json.dumps(out))' \
          "${registry_files[@]}" > /tmp/registry-pull.json
        echo "Using ${#registry_files[@]} Konflux registry credential file(s)"

        merge_cluster_pull_secret() {
          local kubeconfig="$1"
          local cluster_name="$2"

          echo "Merging registry credentials into ${cluster_name} pull-secret"
          KUBECONFIG="${kubeconfig}" oc get secret pull-secret \
            -n openshift-config \
            -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > /tmp/cluster-pull.json
          python3 -c 'import json; cluster=json.load(open("/tmp/cluster-pull.json")); registry=json.load(open("/tmp/registry-pull.json")); cluster.setdefault("auths", {}).update(registry.get("auths", {})); json.dump(cluster, open("/tmp/merged-pull.json", "w"))'

          KUBECONFIG="${kubeconfig}" oc set data secret/pull-secret \
            -n openshift-config \
            --from-file=.dockerconfigjson=/tmp/merged-pull.json
          echo "Registry credentials configured on ${cluster_name}"
        }

        WORKSPACE_PATH="$(workspaces.shared-workspace.path)"
        KUBECONFIG_DIR="${WORKSPACE_PATH}/.kube"
        merge_cluster_pull_secret "${KUBECONFIG_DIR}/source.kubeconfig" source
        merge_cluster_pull_secret "${KUBECONFIG_DIR}/target.kubeconfig" target

        printf SUCCESS > "$(results.status.path)"
