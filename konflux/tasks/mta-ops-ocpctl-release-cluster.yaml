apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-ocpctl-release-cluster
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: Release an OCPCTL cluster back to its pool.
  params:
    - name: clusterId
      type: string
    - name: ocpctlUrl
      type: string
      description: OCPCTL API base URL supplied by the ITS configuration.
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
    - name: delayBeforeRelease
      type: string
      default: "0"
      description: Delay before releasing to avoid concurrent OCPCTL requests.
    - name: maxAttempts
      type: string
      default: "6"
      description: Maximum release attempts for throttling or transient errors.
  steps:
    - name: release
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        delay="$(params.delayBeforeRelease)"
        if [ "${delay}" != "0" ]; then
          echo "Waiting ${delay}s before releasing cluster"
          sleep "${delay}"
        fi

        attempt=1
        max_attempts="$(params.maxAttempts)"
        while [ "${attempt}" -le "${max_attempts}" ]; do
          response=$(curl -sS -w '\n%{http_code}' --insecure \
            -X POST "$(params.ocpctlUrl)/pools/clusters/$(params.clusterId)/release" \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            -H 'Content-Type: application/json' || true)
          http_code=$(printf '%s\n' "${response}" | tail -n 1)

          if [ "${http_code}" = "200" ] || [ "${http_code}" = "202" ]; then
            echo "Cluster released"
            exit 0
          fi

          if { [ "${http_code}" = "429" ] || [ "${http_code}" -ge 500 ]; } && \
             [ "${attempt}" -lt "${max_attempts}" ]; then
            retry_delay=$((attempt * 15))
            echo "OCPCTL release returned HTTP ${http_code}; retrying in ${retry_delay}s (${attempt}/${max_attempts})"
            sleep "${retry_delay}"
            attempt=$((attempt + 1))
            continue
          fi

          echo "OCPCTL release returned HTTP ${http_code}; lease expiry will clean up the cluster"
          printf '%s\n' "${response}" | sed '$d'
          exit 0
        done
