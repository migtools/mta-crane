apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-ocpctl-lease-cluster
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: cluster-lifecycle
spec:
  description: Lease an OpenShift cluster from an OCPCTL pool.
  params:
    - name: poolName
      type: string
      default: ci-sno-pool-1
    - name: leaseDuration
      type: string
      default: "4"
    - name: purpose
      type: string
      default: MTA-Ops Tier 0 testing
    - name: ocpctlUrl
      type: string
      description: OCPCTL API base URL supplied by the ITS configuration.
    - name: ocpctlSecretName
      type: string
      default: ocpctl-ci-key
    - name: ocpctlSecretKey
      type: string
      default: api-key
  results:
    - name: clusterId
      description: OCPCTL cluster UUID.
    - name: clusterName
      description: OCPCTL cluster name.
  steps:
    - name: lease
      image: quay.io/migqe/migqe-base:latest
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: $(params.ocpctlSecretKey)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        attempt=1
        max_attempts=6
        while true; do
          response=$(curl -sS -w '\n%{http_code}' --insecure \
            -X POST "$(params.ocpctlUrl)/pools/$(params.poolName)/lease" \
            -H "Authorization: Bearer ${OCPCTL_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"lease_duration_hours": $(params.leaseDuration), "purpose": "$(params.purpose)"}' || true)
          http_code=$(printf '%s\n' "${response}" | tail -n 1)
          body=$(printf '%s\n' "${response}" | sed '$d')

          if [ "${http_code}" = "200" ] || [ "${http_code}" = "201" ]; then
            break
          fi

          if [ "${http_code}" = "429" ] && [ "${attempt}" -lt "${max_attempts}" ]; then
            delay=$((attempt * 15))
            echo "OCPCTL rate limited the lease request; retrying in ${delay}s (attempt ${attempt}/${max_attempts})"
            sleep "${delay}"
            attempt=$((attempt + 1))
            continue
          fi

          echo "OCPCTL lease failed with HTTP ${http_code}"
          printf '%s\n' "${body}"
          exit 1
        done

        cluster_id=$(printf '%s' "${body}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("cluster_id", ""))')
        cluster_name=$(printf '%s' "${body}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("cluster_name", ""))')
        test -n "${cluster_id}"

        echo "Leased cluster ${cluster_name} (${cluster_id})"
        printf '%s' "${cluster_id}" > "$(results.clusterId.path)"
        printf '%s' "${cluster_name}" > "$(results.clusterName.path)"
