apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mta-ops-extract-image-references
  labels:
    app.kubernetes.io/name: mta-ops
    app.kubernetes.io/component: snapshot-metadata
spec:
  description: Extract the MTA-Ops and rsync image references from the Konflux Snapshot.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux Snapshot JSON.
    - name: registryPullSecretName
      type: string
      default: registry-pull-secrets
  results:
    - name: mtaOpsImagePullspec
      description: MTA-Ops image pullspec from the Snapshot.
    - name: mtaOpsRsyncImage
      description: Rsync transfer image pullspec from the Snapshot.
  volumes:
    - name: registry-pull-secret
      secret:
        secretName: $(params.registryPullSecretName)
        optional: true
  steps:
    - name: extract
      image: quay.io/konflux-ci/konflux-test:stable
      volumeMounts:
        - name: registry-pull-secret
          mountPath: /registry-pull-secret
      env:
        - name: SNAPSHOT_JSON
          value: $(params.SNAPSHOT)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        extract_component_image() {
          local component_name="$1"
          printf '%s' "${SNAPSHOT_JSON}" | jq -r --arg name "${component_name}" \
            '.components[] | select(.name == $name) | .containerImage' | head -n 1
        }

        convert_to_stage_pullspec() {
          local component_name="$1"
          local image="$2"
          local digest="${image##*@}"
          local stage_repository=""

          case "${component_name}" in
            *-mta-ops)
              stage_repository="registry.stage.redhat.io/mta/mta-ops-rhel9"
              ;;
            *-mta-rsync-transfer)
              stage_repository="registry.stage.redhat.io/mta/mta-rsync-transfer-rhel9"
              ;;
            *)
              echo "ERROR: unsupported component for Stage conversion: ${component_name}"
              return 1
              ;;
          esac

          if [[ "${digest}" != sha256:* ]]; then
            echo "ERROR: Snapshot image is not digest-pinned: ${image}"
            return 1
          fi
          printf '%s@%s' "${stage_repository}" "${digest}"
        }

        test -n "${SNAPSHOT_JSON}"
        mta_ops_component_name=$(printf '%s' "${SNAPSHOT_JSON}" | jq -r \
          '.components[].name | select(endswith("-mta-ops"))' | head -n 1)
        rsync_component_name=$(printf '%s' "${SNAPSHOT_JSON}" | jq -r \
          '.components[].name | select(endswith("-mta-rsync-transfer"))' | head -n 1)

        if [ -z "${mta_ops_component_name}" ]; then
          echo "ERROR: Snapshot does not contain an MTA-Ops component"
          printf '%s\n' "${SNAPSHOT_JSON}" | jq -r '.components[]?.name'
          exit 1
        fi
        if [ -z "${rsync_component_name}" ]; then
          echo "ERROR: Snapshot does not contain an rsync transfer component"
          printf '%s\n' "${SNAPSHOT_JSON}" | jq -r '.components[]?.name'
          exit 1
        fi

        mta_ops_image=$(extract_component_image "${mta_ops_component_name}")
        rsync_image=$(extract_component_image "${rsync_component_name}")

        if [ -z "${mta_ops_image}" ] || [ "${mta_ops_image}" = "null" ]; then
          echo "ERROR: Snapshot component ${mta_ops_component_name} has no image"
          printf '%s\n' "${SNAPSHOT_JSON}" | jq -r '.components[]?.name'
          exit 1
        fi
        if [ -z "${rsync_image}" ] || [ "${rsync_image}" = "null" ]; then
          echo "ERROR: Snapshot component ${rsync_component_name} has no image"
          printf '%s\n' "${SNAPSHOT_JSON}" | jq -r '.components[]?.name'
          exit 1
        fi

        mta_ops_stage_image=$(convert_to_stage_pullspec "${mta_ops_component_name}" "${mta_ops_image}")
        rsync_stage_image=$(convert_to_stage_pullspec "${rsync_component_name}" "${rsync_image}")

        registry_config_arg=()
        if [ -s /registry-pull-secret/.dockerconfigjson ]; then
          registry_config_arg=(--registry-config=/registry-pull-secret/.dockerconfigjson)
        fi

        echo "Verifying MTA-Ops image: ${mta_ops_stage_image}"
        oc image info "${mta_ops_stage_image}" --filter-by-os linux/amd64 \
          "${registry_config_arg[@]}" >/dev/null
        echo "Verifying rsync image: ${rsync_stage_image}"
        oc image info "${rsync_stage_image}" --filter-by-os linux/amd64 \
          "${registry_config_arg[@]}" >/dev/null

        echo "MTA-Ops image: ${mta_ops_stage_image}"
        echo "Rsync image: ${rsync_stage_image}"
        printf '%s' "${mta_ops_stage_image}" > "$(results.mtaOpsImagePullspec.path)"
        printf '%s' "${rsync_stage_image}" > "$(results.mtaOpsRsyncImage.path)"
