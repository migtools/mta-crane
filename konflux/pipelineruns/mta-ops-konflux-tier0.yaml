apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: mta-ops-konflux-tier0-
spec:
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/migtools/mta-crane
      - name: revision
        value: konflux-its
      - name: pathInRepo
        value: konflux/pipelines/mta-ops-konflux-tier0.yaml
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
